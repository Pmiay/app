                }

                function actualizarInterfaz() {  
                    document.getElementById('txt-total-ventas').innerText = `$${totalVentas.toFixed(0)}`;
                    document.getElementById('txt-total-utilidad').innerText = `$${(totalVentas-totalCompras).toFixed(0)}`;
                    document.getElementById('txt-total-compras').innerText = `$${totalCompras.toFixed(0)}`;

                    let porcentaje = 0;
                    if (totalVentas > 0) {
                        porcentaje = (totalCompras / totalVentas) * 100;
                    } else if (totalCompras > 0) {
                        porcentaje = 100;
                    }

                    const barra = document.getElementById('barra-progreso');
                    const labelPorcentaje = document.getElementById('label-porcentaje');
                    const alertaLimite = document.getElementById('alerta-limite');
                    const btnCompra = document.getElementById('btn-compra');

                    labelPorcentaje.innerText = `Límite: ${porcentaje.toFixed(1)}% de ${limite}%`;
                    alertaLimite.innerText = `Disponible: $${((totalVentas * limite / 100) - totalCompras).toFixed(2)}`;
                    barra.style.width = `${Math.min(porcentaje, 100)}%`;

                    if (porcentaje >= limite) {
                        barra.className = "bg-red-500 h-full transition-all duration-300";
                        alertaLimite.innerText = "¡Límite Superado!";
                        alertaLimite.className = "text-red-600 font-bold";
                        btnCompra.disabled = true;
                    } else if (porcentaje >= limite / 7 * 5) {
                        barra.className = "bg-amber-500 h-full transition-all duration-300";
                        alertaLimite.className = "text-amber-600 font-bold";
                        btnCompra.disabled = false;
                    } else {
                        barra.className = "bg-green-500 h-full transition-all duration-300";
                        alertaLimite.className = "text-green-600 font-bold";
                        btnCompra.disabled = false;
                    }
                }

                function renderHistorial(lista) {
                    const historial = document.getElementById('historial');
                    if (lista.length === 0) {
                        historial.innerHTML = '<p class="text-gray-400 text-center text-xs py-2">No hay movimientos registrados.</p>';
                        return;
                    }

                    historial.innerHTML = "";
                    lista.forEach(mov => {
                        const item = document.createElement('div');
                        item.className = `flex justify-between items-center p-2 rounded-lg border text-xs ${mov.tipo === 'venta' ? 'bg-green-50 border-green-100 text-green-800' : mov.tipo==='inversion' ?'bg-blue-50 border-blue-100 text-blue-800': 'bg-blue-50 border-blue-100 text-amber-600'}`;
                        item.innerHTML = `
                            <div>
                                <span class="font-bold block">${mov.tipo.toUpperCase()}: ${mov.fecha + "<br>" + mov.descripcion}</span>
                            </div>
                            <span class="font-bold text-sm">${mov.tipo === 'venta' ? '+' : '-'}$${mov.monto.toFixed(2)}</span>
                        `;
                        historial.appendChild(item);
                    });
                }

                function registrar(tipo) {
                    const inputMonto = document.getElementById('monto');
                    const inputDesc = document.getElementById('descripcion');
                    
                    const monto = parseFloat(inputMonto.value);
                    const descripcion = inputDesc.value.trim();

                    if (!monto || monto <= 0 || descripcion === "") {
                        alert("Por favor, ingresa un monto válido y una descripción.");
                        return;
                    }

                    if (tipo === 'compra') {
                        let proximaInversion = totalCompras + monto;
                        let proximoPorcentaje = totalVentas > 0 ? (proximaInversion / totalVentas) * 100 : 100;
                        if (proximoPorcentaje > limite) {
                            alert(`No puedes registrar esta compra. Superaría el límite del ${(limite)}% permitido respecto a tus ventas actuales.`);
                            return;
                        }
                    }

                    if (tipo === 'venta') {
                        totalVentas += monto;
                    } else {
                        totalCompras += monto;
                    }
                    const fecha =  (new Date().toISOString().split('T')[0]);
                    movimientos.unshift({ fecha, tipo, monto, descripcion });

                    inputMonto.value = "";
                    inputDesc.value = "";
                    
                    guardarDatos();
                    renderHistorial(movimientos);
                    actualizarInterfaz();
                }  
            //Controlar exportación de datos
            function exportarDatos() {
                // 1. Obtener todos los datos de localStorage
                const datos = JSON.stringify(localStorage);
                
                // 2. Crear un archivo temporal con los datos
                const blob = new Blob([datos], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                
                // 3. Crear un enlace oculto para forzar la descarga
                const a = document.createElement("a");
                a.href = url;
                a.download = "mis_datos_backup.json"; // Nombre del archivo
                document.body.appendChild(a);
                a.click();
                
                // 4. Limpiar el elemento temporal
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            function importarDatos(evento) {
                const archivo = evento.target.files[0];
                if (!archivo) return;

                const lector = new FileReader();
                lector.onload = function(e) {
                    try {
                        // 1. Leer y procesar el contenido del archivo
                        const datos = JSON.parse(e.target.result);
                        
                        // 2. Guardar cada clave-valor en el nuevo localStorage
                        Object.keys(datos).forEach(clave => {
                            localStorage.setItem(clave, datos[clave]);
                        });

                        alert("¡Datos importados con éxito! Recarga la página para ver los cambios.");
                        location.reload(); // Recarga la página automáticamente
                    } catch (error) {
                        alert("Error al importar: El archivo no es válido.");
                    }
                };
                lector.readAsText(archivo);
            }
                
            // Opción de historial en Tabla
            // Referencias a los elementos del HTML
                const formulario = document.getElementById('form-registro');
                const tablaRegistros = document.getElementById('historial');
                const buscador = document.getElementById('buscador');

                // Escuchar cuando el usuario procesa el formulario
                formulario.addEventListener('submit', (e) => {
                    e.preventDefault(); // Evitamos que la página se recargue

                    // 1. Capturamos los datos ingresados
                    const nuevaFecha = new Date().toISOString().split('T')[0]; //document.getElementById('fecha').value;
                    const nuevoTipo = document.querySelector('input[name="tipo"]:checked').value;
                    const nuevaDescripcion = document.getElementById('descripcion').value;
                    const nuevoMonto = parseFloat(document.getElementById('monto').value);

                    // 2. Creamos el nuevo objeto movimiento y lo añadimos al arreglo
                        const nuevoMovimiento = {
                            id: idContador++,
                            fecha: nuevaFecha,
                            tipo: nuevoTipo,
                            descripcion: nuevaDescripcion,
                            monto: nuevoMonto
                        };
                    movimientosT.push(nuevoMovimiento);

                    // 3. Limpiamos el formulario para una nueva captura
                    formulario.reset();

                    // 4. Actualizamos la visualización en la segunda pestaña
                    renderizarTabla(movimientosT);
                    
                    // Opcional: Si quieres llevar al usuario automáticamente a ver los registros tras guardar
                    const bootstrapTab = new bootstrap.Tab(document.getElementById('registros-tab'));
                    bootstrapTab.show();
                });
                // --- EVENTO 2: BUSCADOR DINÁMICO (Línea de código clave) ---
                buscador.addEventListener('input', (e) => {
                    const textoBusqueda = e.target.value.toLowerCase();

                    // Filtramos el arreglo original usando .filter y .includes
                    const movimientosFiltrados = movimientos.filter(movimiento => 
                        movimiento.descripcion.toLowerCase().includes(textoBusqueda)
                    );

                    // Renderizamos solo los movimientos que coincidieron con la búsqueda
                    renderizarTabla(movimientosFiltrados);
                });
                // Función encargada de pintar los datos en la Pestaña 2
                function renderizarTabla(Lista) {
                    // Vaciamos la tabla anterior para evitar duplicados
                    tablaRegistros.innerHTML = '';

                    // Recorremos el arreglo de movimientos para rellenar el div/tabla
                    Lista.forEach((movimiento) => {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `
                            <td>${movimiento.id}</td>
                            <td>${movimiento.fecha}</td>
                            <td>${movimiento.tipo}</td>
                            <td>${movimiento.descripcion}</td>
                            <td>$${movimiento.monto.toFixed(2)}</td>
                        `;
                        tablaRegistros.appendChild(fila);
                    });
                }


        </script>
